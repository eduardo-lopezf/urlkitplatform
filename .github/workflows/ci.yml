name: ci
on: [push, pull_request]
jobs:
  quality:
    runs-on: ubuntu-latest
    # Real Valkey so apps/api/tests/integration/valkey.test.ts runs instead of being skipped.
    services:
      redis:
        image: valkey/valkey:8-alpine
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm boundaries
      - run: pnpm test
        env: { REDIS_URL: 'redis://localhost:6379' }
      - run: pnpm --filter @urlkit/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm build
      - run: pnpm size
      - run: pnpm lhci

  # Second SSRF barrier (Principio V) on Linux Docker Engine, which T110 could only test on
  # Docker Desktop. It does not replace T111: the provider's own network is not tested here.
  egress-linux:
    runs-on: ubuntu-latest
    # Job-wide: the selfhosted step runs `up` again, and the API must keep the same secret.
    env:
      QUOTA_SECRET: ci-only-${{ github.run_id }}-0123456789abcdef0123
    steps:
      - uses: actions/checkout@v4
      - name: Start Valkey, API and egress-guard on Docker Engine
        run: docker compose --profile full up -d --build --wait redis api egress-guard
      - name: Egress rules are in place
        run: |
          for i in $(seq 1 15); do
            n=$(sudo iptables -S DOCKER-USER | grep -c 172.30.0.0/24 || true)
            [ "$n" -ge 16 ] && exit 0; sleep 2
          done
          sudo iptables -S DOCKER-USER; exit 1
      # GitHub runners are Azure VMs, where the metadata service answers. Without this control,
      # a blocked probe would prove nothing: an address that does not exist also fails.
      - name: Control - the runner itself reaches the cloud metadata service
        run: curl -sf -m 3 -H 'Metadata:true' 'http://169.254.169.254/metadata/instance?api-version=2021-02-01' >/dev/null
      # Not `! probe`: bash -e ignores negated commands, so the step would never fail.
      - name: The API container cannot
        run: |
          probe() { docker compose exec -T api node -e "
            const s = require('net').connect({ host: '$1', port: $2, timeout: 3000 });
            s.on('connect', () => process.exit(0));
            s.on('timeout', () => process.exit(1)); s.on('error', () => process.exit(1));"; }
          if probe 169.254.169.254 80; then echo 'reached metadata'; exit 1; fi
          probe 1.1.1.1 443 || { echo 'public egress broken'; exit 1; }
      # The same check as on the VPS (T111), here on Linux Docker Engine: the whole selfhosted
      # stack behind Caddy with its local CA (API_DOMAIN defaults to localhost, no .env in CI).
      - name: Selfhosted stack passes infrastructure/check-selfhosted.sh
        run: |
          docker compose --profile selfhosted up -d --build --wait
          bash infrastructure/check-selfhosted.sh
