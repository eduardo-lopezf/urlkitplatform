# Receives the API traces. Span attributes are already limited to registrable domain, status and
# duration by the API; the attributes processor drops anything else as a second barrier.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
processors:
  attributes/strip:
    actions:
      - { key: url.full, action: delete }
      - { key: url.path, action: delete }
      - { key: url.query, action: delete }
      - { key: http.url, action: delete }
      - { key: http.target, action: delete }
      - { key: client.address, action: delete }
      - { key: net.peer.ip, action: delete }
  batch: {}
exporters:
  debug: {}
service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [attributes/strip, batch]
      exporters: [debug]
