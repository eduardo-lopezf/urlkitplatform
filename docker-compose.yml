# Development entry point and, with `--profile selfhosted`, the MVP production stack on one VPS
# (research R12). The web is static and goes to a CDN, so it is not part of Compose.
# Cross-service configuration lives in infrastructure/ (see infrastructure/README.md).

# Docker keeps container logs without a size limit by default. The logs carry no URLs or IPs
# (Principio V), but on a VPS that runs for months they would fill the disk.
x-logging: &logging
  driver: json-file
  options: { max-size: '10m', max-file: '3' }

services:
  redis:
    logging: *logging
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    # Host ports are bound to loopback only: Valkey has no password, and with the `selfhosted`
    # profile only Caddy (80/443) may face the outside. Same for the API and monitoring below.
    ports:
      - '127.0.0.1:6379:6379'
    # `default` lets development reach it on localhost:6379; the API reaches it on `internal`.
    networks: [default, internal]

  # Organizations, API key hashes and daily usage counts (003, research R12). Never URLs or IPs.
  # Like Valkey: the API reaches it on `internal`; `default` only lets development reach it on
  # localhost, and its port is bound to loopback, so nothing outside the server can connect.
  postgres:
    logging: *logging
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: urlkit
      POSTGRES_DB: urlkit
      # Set POSTGRES_PASSWORD in .env on a server (openssl rand -hex 24). The default is only for
      # development: the database is unreachable from outside either way.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-urlkit}
    # POSTGRES_PORT moves the development port if 5432 is taken by another project.
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U urlkit -d urlkit']
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [default, internal]

  api:
    logging: *logging
    profiles: [full, selfhosted]
    build: { context: ., dockerfile: apps/api/Dockerfile }
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgres://urlkit:${POSTGRES_PASSWORD:-urlkit}@postgres:5432/urlkit
      # `:?` would break `docker compose up -d` for Valkey alone: Compose interpolates every service.
      # Without a secret of 32+ characters the API refuses to start (NODE_ENV=production).
      QUOTA_SECRET: ${QUOTA_SECRET:-}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:4321}
      # Empty means disabled (see .env.example).
      SENTRY_DSN: ${SENTRY_DSN:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      # Caddy is the only way in from outside (8787 is bound to loopback), so the client IP for
      # quotas is the last X-Forwarded-For entry, the one Caddy adds. Without it every visitor
      # would share Caddy's address and a single quota.
      TRUST_PROXY: '1'
    ports:
      - '127.0.0.1:8787:8787'
    depends_on:
      redis: { condition: service_started }
      postgres: { condition: service_healthy }
    # Outbound traffic of the inspector leaves only through the egress network, whose internal
    # ranges are dropped by egress-guard. Second barrier: never a substitute for IP validation.
    networks: [internal, egress]

  # Applies the egress firewall to the egress network on the Docker host (Linux Docker Engine
  # and the Docker Desktop VM). The rules are lost on reboot, so it stays running: Docker restarts
  # it at boot and it applies them again (the script is idempotent).
  egress-guard:
    logging: *logging
    profiles: [full, selfhosted]
    image: alpine:3.22
    network_mode: host
    cap_add: [NET_ADMIN]
    init: true
    volumes:
      - ./infrastructure/egress/apply-rules.sh:/apply-rules.sh:ro
    command: ['sh', '-c', 'sh /apply-rules.sh 172.30.0.0/24 && exec sleep infinity']
    restart: unless-stopped

  caddy:
    logging: *logging
    profiles: [selfhosted]
    image: caddy:2-alpine
    restart: unless-stopped
    # 443/udp is HTTP/3, which Caddy enables by default; without it browsers stay on HTTP/2.
    ports: ['80:80', '443:443', '443:443/udp']
    environment:
      # The public name of the API; `localhost` gets a certificate from Caddy's local CA.
      API_DOMAIN: ${API_DOMAIN:-localhost}
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and ACME account survive recreations (Let's Encrypt rate-limits reissues).
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]
    # Caddy needs inbound ports and outbound ACME, so it shares the egress network with the API.
    networks: [egress]

  prometheus:
    logging: *logging
    profiles: [monitoring]
    image: prom/prometheus:v3.5.0
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ['127.0.0.1:9090:9090']
    networks: [internal]

  otel-collector:
    logging: *logging
    profiles: [monitoring]
    image: otel/opentelemetry-collector:0.130.0
    volumes:
      - ./infrastructure/monitoring/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports: ['127.0.0.1:4318:4318']
    networks: [internal]

volumes:
  postgres_data: {}
  caddy_data: {}
  caddy_config: {}

networks:
  default: {}
  # No route to the outside world: Valkey and internal services only.
  internal:
    internal: true
  # The only network with outbound access. Fixed subnet so egress-guard can target it.
  egress:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
